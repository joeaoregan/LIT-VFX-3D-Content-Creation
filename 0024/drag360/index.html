<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <link rel="icon" type="image/png" href="../../favicon.png" />
  <title>1989 Batmobile — Click &amp; Drag 360° Cycles Viewer (v0024)</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #f5b942;
      --bg-dark: #05070c;
      --border: rgba(245, 185, 66, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      color: #f0f2f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .hud-header {
      position: fixed;
      top: 1.25rem;
      left: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: rgba(8, 11, 18, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .hud-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .badge {
      background: rgba(245, 185, 66, 0.16);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .hud-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.85rem;
      font-size: 0.85rem;
    }

    .hud-stat {
      font-variant-numeric: tabular-nums;
      color: #c3cad9;
    }

    .btn {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 0.38rem 0.8rem;
      border-radius: 6px;
      background: rgba(245, 185, 66, 0.12);
      border: 1px solid rgba(245, 185, 66, 0.35);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background: rgba(245, 185, 66, 0.25);
    }

    .viewer-stage {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      touch-action: none;
    }

    .viewer-stage.dragging {
      cursor: grabbing;
    }

    canvas#batmobile-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hint-pill {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      background: rgba(8, 11, 18, 0.82);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: #d6dceb;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header class="hud-header">
    <div class="hud-title">
      <span>1989 Batmobile — Click &amp; Drag 360° (v0024 Cycles)</span>
      <span class="badge">240 Frames · Fog + Bat-Signal</span>
    </div>
    <div class="hud-controls">
      <span class="hud-stat" id="load-status">Loading: 0 / 240</span>
      <span class="hud-stat" id="frame-readout">Angle: 0.0°</span>
      <button class="btn" id="spin-toggle" type="button">Auto-Spin: Off</button>
      <a class="btn" href="../../index.html">← Home</a>
      <a class="btn" href="../../threejs/index.html">Compare Three.js 3D →</a>
    </div>
  </header>

  <div class="viewer-stage" id="stage">
    <canvas id="batmobile-canvas" width="1920" height="1080" aria-label="1989 Batmobile click and drag 360 viewer"></canvas>
  </div>

  <div class="hint-pill">Click and drag left or right to spin 360°</div>

  <script>
    const TOTAL_FRAMES = 240;
    const canvas = document.getElementById('batmobile-canvas');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    const loadStatus = document.getElementById('load-status');
    const frameReadout = document.getElementById('frame-readout');
    const spinToggle = document.getElementById('spin-toggle');

    const images = new Array(TOTAL_FRAMES);
    let loadedCount = 0;
    let currentFrame = 0;
    let isDragging = false;
    let startX = 0;
    let startFrame = 0;
    let autoSpin = false;
    let lastTime = 0;

    function pad4(n) {
      return String(n).padStart(4, '0');
    }

    function wrapFrame(n) {
      return ((n % TOTAL_FRAMES) + TOTAL_FRAMES) % TOTAL_FRAMES;
    }

    function drawFrame(idx) {
      const i = wrapFrame(Math.round(idx));
      currentFrame = i;
      const img = images[i];
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      }
      const deg = ((i / TOTAL_FRAMES) * 360).toFixed(1);
      frameReadout.textContent = `Angle: ${deg}° (${pad4(i + 1)} / ${TOTAL_FRAMES})`;
    }

    for (let i = 0; i < TOTAL_FRAMES; i++) {
      const img = new Image();
      img.src = `../full_240fps24/frames/frame_${pad4(i + 1)}.jpg`;
      img.onload = () => {
        loadedCount++;
        loadStatus.textContent = loadedCount === TOTAL_FRAMES
          ? 'All 240 frames ready'
          : `Loading: ${loadedCount} / ${TOTAL_FRAMES}`;
        if (i === 0) drawFrame(0);
      };
      images[i] = img;
    }

    stage.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startFrame = currentFrame;
      stage.classList.add('dragging');
      stage.setPointerCapture(e.pointerId);
    });

    stage.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const framesDelta = Math.round(dx / 4);
      drawFrame(startFrame - framesDelta);
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      stage.classList.remove('dragging');
      if (stage.hasPointerCapture(e.pointerId)) {
        stage.releasePointerCapture(e.pointerId);
      }
    }

    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);

    spinToggle.addEventListener('click', () => {
      autoSpin = !autoSpin;
      spinToggle.textContent = autoSpin ? 'Auto-Spin: On' : 'Auto-Spin: Off';
    });

    function tick(ts) {
      if (autoSpin && !isDragging) {
        if (ts - lastTime > 42) {
          lastTime = ts;
          drawFrame(currentFrame + 1);
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
