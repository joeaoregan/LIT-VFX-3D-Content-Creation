<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="icon" type="image/png" href="../favicon.png" />
  <title>1989 Batmobile — AR View (Google Pixel / iOS)</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js" integrity="sha384-sr9b4Ux0WhAUGclJ0ym0FSY2zSOMmNSn0bP/SA0e6bNCrpn/5W3QL8mm+LdlQMKw" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: dark;
      --accent: #f5b942;
      --bg-dark: #06080e;
      --border: rgba(245, 185, 66, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 45%, #121828 0%, #05070c 100%);
      color: #f0f2f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      overflow: hidden;
    }

    .hud-header {
      position: fixed;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 0.75rem 1rem;
      background: rgba(8, 11, 18, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .hud-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .badge {
      background: rgba(245, 185, 66, 0.16);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.25;
      white-space: nowrap;
    }

    .btn {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 0.38rem 0.8rem;
      border-radius: 6px;
      background: rgba(245, 185, 66, 0.12);
      border: 1px solid rgba(245, 185, 66, 0.35);
      font-size: 0.82rem;
      white-space: nowrap;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background: rgba(245, 185, 66, 0.25);
    }

    model-viewer {
      width: 100vw;
      height: 100dvh;
      --poster-color: transparent;
    }

    .ar-button {
      position: fixed;
      bottom: max(2.25rem, calc(env(safe-area-inset-bottom) + 1.5rem));
      left: 50%;
      transform: translateX(-50%);
      padding: 0.8rem 1.5rem;
      border-radius: 999px;
      background: var(--accent);
      color: #090b10;
      font-weight: 800;
      font-size: 0.92rem;
      white-space: nowrap;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(245, 185, 66, 0.4);
    }

    .ar-reset-btn {
      display: none;
      position: fixed;
      bottom: max(1.5rem, calc(env(safe-area-inset-bottom) + 1rem));
      right: 1.25rem;
      z-index: 20;
      align-items: center;
      gap: 0.35rem;
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      background: rgba(8, 11, 18, 0.65);
      backdrop-filter: blur(8px);
      color: #f0f2f7;
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .ar-reset-btn:active {
      background: rgba(245, 185, 66, 0.28);
      border-color: var(--accent);
    }

    model-viewer[ar-status="session-started"] .ar-reset-btn,
    model-viewer[ar-status="object-placed"] .ar-reset-btn {
      display: inline-flex;
    }

    @media (max-width: 600px) {
      .hud-title {
        font-size: 0.82rem;
      }

      .badge {
        font-size: 0.62rem;
        padding: 0.16rem 0.5rem;
      }
    }
  </style>
</head>
<body>
  <header class="hud-header">
    <div class="hud-title">
      <span>1989 Batmobile — Web AR (6.63 m Scale)</span>
      <span class="badge">WebXR · Scene Viewer · Quick Look</span>
    </div>
    <div>
      <a class="btn" href="../index.html">← Home</a>
    </div>
  </header>

  <model-viewer
    id="batmobile-ar"
    src="../1989_Batmobile.glb?v=3"
    alt="1989 Batmobile 3D Model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    tone-mapping="neutral"
    shadow-intensity="1"
    exposure="1.0">
    <button slot="ar-button" class="ar-button">
      View in Your Space (AR)
    </button>
    <button type="button" id="ar-reset-btn" class="ar-reset-btn" aria-label="Reset model position">
      ↺ Reset
    </button>
  </model-viewer>

  <script>
    const viewer = document.getElementById('batmobile-ar');
    const resetBtn = document.getElementById('ar-reset-btn');

    // Prevent tapping the discreet Reset button from moving the AR object directly
    resetBtn.addEventListener('beforexrselect', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });

    resetBtn.addEventListener('click', (event) => {
      event.stopPropagation();

      // Reset orientation and framing
      viewer.orientation = '0deg 0deg 0deg';
      viewer.updateFraming();

      // Re-place on the floor in front of where the camera is currently facing
      const cx = window.innerWidth * 0.5;
      const cy = window.innerHeight * 0.65;
      const opts = {
        bubbles: true,
        cancelable: true,
        pointerId: 1,
        pointerType: 'touch',
        isPrimary: true,
        clientX: cx,
        clientY: cy
      };
      viewer.dispatchEvent(new PointerEvent('pointerdown', opts));
      viewer.dispatchEvent(new PointerEvent('pointerup', opts));
    });
  </script>
</body>
</html>
