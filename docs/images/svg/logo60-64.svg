<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="240" height="132" role="img" aria-label="1960-1964 Batman Logo">
  <style>
    .bat-spin {
      transform-origin: 200px 110px;
      animation: bat60s 4.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes bat60s {
      0% {
        transform: scale(0.02) rotate(-720deg);
        opacity: 0;
      }
      28% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
      62% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
      90% {
        transform: scale(0.02) rotate(720deg);
        opacity: 0;
      }
      100% {
        transform: scale(0.02) rotate(720deg);
        opacity: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .bat-spin {
        animation: none;
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }
  </style>
  <g class="bat-spin">
    <!-- Outer Black Border & Yellow Oval -->
    <ellipse cx="200" cy="110" rx="184" ry="96" fill="#fff200" stroke="#000000" stroke-width="8"/>
    <!-- 1960-64 Pointed-Wing Bat Silhouette -->
    <path fill="#000000" d="
      M 200,180
      C 192,162 184,148 175,142
      C 162,146 150,154 139,165
      C 136,149 128,136 116,131
      C 97,131 79,137 64,147
      C 76,105 97,74 123,56
      C 142,72 162,82 178,84
      L 182,53
      L 190,64
      C 196,65 204,65 210,64
      L 218,53
      L 222,84
      C 238,82 258,72 277,56
      C 303,74 324,105 336,147
      C 321,137 303,131 284,131
      C 272,136 264,149 261,165
      C 250,154 238,146 225,142
      C 216,148 208,162 200,180
      Z
    "/>
  </g>
</svg>
